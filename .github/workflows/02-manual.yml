name: 02 - Manual

on: 
    workflow_dispatch: 
        inputs:
            logging_level:
                description: Nivel de logging
                required: true
                default: "info"
                type: choice
                options:
                 - info
                 - debug
                 - warn
                 - error

            environment:
                description: Entorno de despliegue
                type: environment
                required: true

            dry_run:
                description: Ejecutar en modo simulación
                required: false
                default: false
                type: boolean

            reason:
                description: Motivo de la ejecución
                required: false
                default: "Manual excution"
                type: "string"
            
            

jobs:
    manual: 
        runs-on: ubuntu-24.04
        steps:
            - name: Mostrar todos los inputs
              env:
                LOG_LEVEL: ${{ inputs.logging_level }}
                ENVIRONMENT: ${{ inputs.environment }}
                DRY_RUN: ${{ inputs.dry_run }}
                REASON: ${{ inputs.reason }}
              run: |
                echo "LOG_LEVEL: $LOG_LEVEL"
                echo "ENVIRONMENT: $ENVIRONMENT"
                echo "DRY_RUN: $DRY_RUN"
                echo "REASON: $REASON"


            - name: Deploy (solo si no es dry-run)
              if: ${{ !inputs.dry_run }}
              env:
                ENVIROMMENT: ${{ inputs.environment }}
              run: |
                echo "Deploying to $ENVIROMMENT"
                  
            - name: Deploy (solo si es dry-run)
              if: ${{ inputs.dry_run }}
              env:
                ENVIROMMENT: ${{ inputs.environment }}
              run: |
                echo "Dry run: no changes applied"
                  
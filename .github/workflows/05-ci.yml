name: 05 - CI

on:
    push: 
        branches: [main]
    pull_request: 
        branches: [main]
    
jobs:
    frontend-lint:
        runs-on: ubuntu-24.04
        steps:
          - name: Checkout code
            uses: actions/checkout@v6

          - name: Setup pnpm and Node.js
            uses: ./.github/actions/setup-pnpm-ci-cd

          - name:  Lint
            run: |
             cd 12-ejercicio-cicd
             echo "::group::Lint"
             pnpm lint:frontend
             echo "::endgroup::"

    frontend-test:
        runs-on: ubuntu-24.04
        steps:

          - name: Checkout code
            uses: actions/checkout@v6

          - name: Setup pnpm and Node.js
            uses: ./.github/actions/setup-pnpm-ci-cd

          - name:  Test
            run: |
              cd 12-ejercicio-cicd
              echo "::group::Test"
              pnpm test:frontend
              echo "::endgroup::"

    frontend-build:
        needs: [frontend-lint, frontend-test]
        runs-on: ubuntu-24.04
        steps:
          - uses: actions/checkout@v6
          - uses: ./.github/actions/setup-pnpm-ci-cd

          - name:  Build
            run: |
             cd 12-ejercicio-cicd
             echo "::group::Build" 
             pnpm build:frontend
             echo "::endgroup::"
 
    frontend-test-matrix:
      runs-on: ${{ matrix.os }}
      continue-on-error: true
      strategy:
        fail-fast: false
        matrix:
          os: [ubuntu-24.04, macos-latest, windows-latest]
          node: ['22', '24']
      steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-ci-cd
        with:
          node-version: ${{ matrix.node }}

      - name: Test frontend
        run: |
             cd 12-ejercicio-cicd
             echo "::group::Test" 
             pnpm test:frontend
             echo "::endgroup::"

    backend-lint:
        runs-on: ubuntu-24.04
        steps:

          - name: Checkout code
            uses: actions/checkout@v6

          - name: Setup pnpm and Node.js
            uses: ./.github/actions/setup-pnpm-ci-cd

          - name:  Lint
            run: |
             cd 12-ejercicio-cicd
             echo "::group::Lint" 
             pnpm lint:backend
             echo "::endgroup::"
 
    backend-test:

        runs-on: ubuntu-24.04
        steps:

          - name: Checkout code
            uses: actions/checkout@v6
            
          - name: Setup pnpm and Node.js
            uses: ./.github/actions/setup-pnpm-ci-cd

          - name: Test
            run: |
             cd 12-ejercicio-cicd
             echo "::group::Test" 
             pnpm test:backend
             echo "::endgroup::" 

          - name: Build
            run: |
             cd 12-ejercicio-cicd
             pnpm build

    backend-build-test:
        needs: [backend-lint, backend-test]
        runs-on: ubuntu-24.04
        steps:

          - name: Checkout code
            uses: actions/checkout@v6

          - name: Setup pnpm and Node.js
            uses: ./.github/actions/setup-pnpm-ci-cd

          - name: build test
            run: |
             cd 12-ejercicio-cicd
             echo "::group::Build backend" 
             pnpm build:backend
             pnpm start:backend &
             sleep 5
             curl -X GET http://localhost:3000/health
             echo "::endgroup::"